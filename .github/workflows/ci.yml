name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and workflow tests
        run: python -m unittest discover -s tests -v
      - name: MCP stdio protocol check
        run: python scripts/check_mcp.py
      - name: Generate offline sample
        run: python -m forms26_mcp.demo --root examples --path orders_fmb.xml --out /tmp/forms26-demo.json

  upstream-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Forms26
        run: python -m pip install .
      - name: Download pinned upstream and public fixtures
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request, zipfile
          from pathlib import Path
          archive = Path('/tmp/oracle-forms-mcp.zip')
          url = 'https://github.com/aoreshkov/oracle-forms-mcp/releases/download/v0.15.0/oracle-forms-mcp-server-0.15.0.zip'
          urllib.request.urlretrieve(url, archive)
          expected = 'd4b8d295dacb72d089ce43d0e314e1f79bd89b97f2d403e0ba778c021bac9eee'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as z:
              z.extractall('/tmp/forms26-upstream')
          launcher = next(Path('/tmp/forms26-upstream').rglob('bin/server'))
          launcher.chmod(0o755)
          config = {'command': str(launcher), 'args': ['--forms-dir', '/tmp/forms26-examples', '--cache-dir', '/tmp/forms26-cache'], 'env': {'JAVA_HOME': os.environ['JAVA_HOME']}}
          Path('/tmp/forms26-upstream.json').write_text(json.dumps(config))
          PY
          python scripts/fetch_examples.py --suite upstream --out /tmp/forms26-examples
      - name: Exercise actual upstream through Forms26
        run: python scripts/check_upstream.py --config /tmp/forms26-upstream.json --modules ORDERS.fmb UTILS.pll OBJECTS.olb STYLES.fmb TOOLBAR.fmb PICKER.fmb ENTRY.fmb DUPES.fmb MAINMENU.mmb CLAIMS.fmb --output /tmp/forms26-upstream-results.json

  apx-testkit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/checkout@v6
        with:
          repository: satwikjambula/apx-testkit
          ref: 10565ad65f8533b8aab8fa55ac1f546abfcd37aa
          path: .external/apx-testkit
          persist-credentials: false
      - name: Install Forms26
        run: python -m pip install .
      - name: Build actual QA provider
        working-directory: .external/apx-testkit
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test -w packages/mcp
      - name: Prepare QA fixture workspace
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          provider = Path('.external/apx-testkit').resolve()
          root = Path(os.environ['RUNNER_TEMP']) / 'forms26-qa'
          root.mkdir()
          names = ['reference-fixtures', 'duplicate-button-fixture', 'navigation-safety-fixture', 'modal-dialog-fixture', 'region-resolution-fixture']
          for name in names:
              shutil.copytree(provider / 'packages/generator/test/fixtures' / name, root / name)
          (root / 'package.json').write_text('{"private":true,"type":"module"}\n')
          (root / 'node_modules').symlink_to(provider / 'node_modules', target_is_directory=True)
          config = {'command': shutil.which('node'), 'args': [str(provider / 'packages/mcp/dist/server.js')], 'workspace_root': str(root)}
          Path(os.environ['RUNNER_TEMP'], 'forms26-testkit.json').write_text(json.dumps(config))
          PY
      - name: Generate post-development tests through MCP
        run: python scripts/check_testkit.py --config "$RUNNER_TEMP/forms26-testkit.json" --exports reference-fixtures duplicate-button-fixture navigation-safety-fixture modal-dialog-fixture region-resolution-fixture --run-prefix ci --development-ref fixture-validation:10565ad65f8533b8aab8fa55ac1f546abfcd37aa --output "$RUNNER_TEMP/forms26-testkit-results.json"
      - name: Discover generated test cases without a browser
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'forms26-qa'
          cli = Path('.external/apx-testkit/node_modules/@playwright/test/cli.js').resolve()
          for output in sorted((root / 'qa-output').glob('ci-*')):
              config = output / 'playwright.config.ts'
              config.write_text("import { defineConfig } from '@playwright/test';\nexport const APP_BASE = 'http://127.0.0.1:65535/test-only/';\nexport default defineConfig({ testDir: './tests' });\n")
              subprocess.run(['node', str(cli), 'test', '--list', '--config', str(config)], check=True)
          PY
