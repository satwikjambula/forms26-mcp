name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and workflow tests
        run: python -m unittest discover -s tests -v
      - name: MCP stdio protocol check
        run: python scripts/check_mcp.py
      - name: Generate offline sample
        run: python -m forms26_mcp.demo --root examples --path orders_fmb.xml --out /tmp/forms26-demo.json
